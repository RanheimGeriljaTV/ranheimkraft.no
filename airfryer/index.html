      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "Kraft-Fryer",
            "url": "https://ranheimkraft.no/airfryer/",
            "description": "Gratis kalkulator som gjør stekeovnsoppskrift om til airfryer: riktig temperatur og tid, hurtigvalg for pommes frites, kylling og egg og nedtellingsklokke.",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any",
            "inLanguage": "nb",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "NOK" }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Hvordan regner jeg om fra stekeovn til airfryer?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Senk temperaturen med 20 °C for over-/undervarme eller 10 °C for varmluft, og korte tiden med 20 % (10 % ved full kurv). Kalkulatoren gjør dette for deg mens du justerer."
                }
              },
              {
                "@type": "Question",
                "name": "Hvilken temperatur skal jeg bruke i airfryeren når oppskriften sier 200 grader?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Med over-/undervarme blir det 180 °C, og med varmluft 190 °C. Tiden blir ca. 20 % kortere. Sjekk maten litt før tiden er ute."
                }
              },
              {
                "@type": "Question",
                "name": "Hva gjør jeg når oppskriften krever mer enn 220 grader?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "De fleste airfryere går bare til 200 °C. Kalkulatoren kutter da temperaturen til 200 °C og øker tiden for å veie opp, for eksempel ca. 23 % mer tid når oppskriften egentlig tilsier 230 °C."
                }
              },
              {
                "@type": "Question",
                "name": "Hvor lenge skal egg være i airfryeren?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Kokte egg tar 11–13 minutter på 125 °C, testet på Philips Airfryer XL. Kortere tid gir mykere plomme."
                }
              },
              {
                "@type": "Question",
                "name": "Når skal jeg riste kurven eller snu maten?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Halvveis i tiden. Nedtellingsklokken varsler med lyd og vibrasjon når det er tid, og igjen når maten er ferdig."
                }
              }
            ]
          }
        ]
      }
    </script>
