name: 🔄 Auto-Sync Subprosjekter

on:
  # Manuell kjøring fra GitHub Actions fanen
  workflow_dispatch:
    inputs:
      project:
        description: 'Velg prosjekt å synkronisere (f.eks. "quiz", "qr", "fryer", "skatt", "promille" eller "all")'
        required: false
        default: 'all'

  # Tidsplan: Kjører automatisk hver 3. time
  schedule:
    - cron: '0 */3 * * *'

  # Webhook/Dispatch: Kan trigges fra subrepoer ved push
  repository_dispatch:
    types: [sync-subproject, quiz-updated, qr-updated, tabell-updated, trd-updated, events-updated, fryer-updated, skatt-updated, promille-updated]

permissions:
  contents: write

# Bare én synk om gangen. Hindrer at tidsplan, dispatch og manuell kjøring krasjer i «git push».
concurrency:
  group: sync-subprojects
  cancel-in-progress: false

jobs:
  sync:
    name: Synkroniser Subprosjekter
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Sjekk ut ranheimkraft.no
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Sett opp Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      # continue-on-error: Et prosjekt som feiler skal ikke hindre at de andre blir lagret.
      # Jobben blir likevel rød i siste steg hvis noe feilet.
      - name: 🔄 Kjør synkroniseringsmotor
        id: sync
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_PROJECT: ${{ github.event.inputs.project || 'all' }}
        run: |
          python scripts/sync_subprojects.py --project "$SYNC_PROJECT"

      - name: 🚀 Commit og push endringer hvis oppdatert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Bare mappene og filene synken eier (ikke «git add .», som tar med alt som ligger igjen)
          for path in assets airfryer events promille quiz.html qr.html skatt tabell tipping trd scripts/update_obos_standings.py; do
            [ -e "$path" ] && git add -- "$path"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): automatisk synkronisering av subprosjekter"
            git push
            echo "Nye endringer ble funnet, committet og pushet!"
          else
            echo "Alt er allerede oppdatert. Ingen endringer nødvendig."
          fi

      - name: ❌ Feil hvis synkroniseringen hadde feil
        if: steps.sync.outcome == 'failure'
        run: |
          echo "Minst ett prosjekt feilet under synkroniseringen. Se loggen i steget over."
          exit 1
